<!doctype html><html lang="en"><meta charset="utf-8"><title>Loading indicator native size review</title><style>
*{box-sizing:border-box}body{margin:0;background:#10171d;color:#f2f5f7;font:14px system-ui;padding:24px}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0 18px 0 0}button,select{background:#18242d;color:inherit;border:1px solid #526571;border-radius:8px;padding:8px}#grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:20px}article{height:158px;border:1px solid #33434d;border-radius:12px;padding:12px}h2{font-size:13px;font-weight:550;margin:0 0 12px}.sizes{height:90px;display:flex;gap:16px;align-items:center;justify-content:space-around}figure{margin:0;text-align:center;min-width:32px}figcaption{font:10px ui-monospace;color:#a7b6bf;margin-top:10px}canvas{display:block;margin:auto}#status{color:#adbdc7}body[data-theme=light]{background:#f5f9f8;color:#12242a}body[data-theme=light] article{border-color:#becfcc}body[data-theme=light] button,body[data-theme=light] select{background:#f5f9f8}
</style><header><h1>Loading indicators · native size review</h1><select id="set" aria-label="Set"><option value="12">Loading indicators</option></select><select id="style" aria-label="Paint"><option value="outline/2">Outline Regular</option><option value="outline/1.5">Outline Light</option><option value="outline/2.5">Outline Bold</option><option value="solid/2">Solid</option><option value="duotone/2">Duotone</option></select><select id="profile" aria-label="Motion"><option value="strong">Strong motion</option><option value="light">Light motion</option></select><select id="pose" aria-label="Pose"><option value="end">Start / reduced motion</option><option value="quarter">Quarter cycle</option><option value="mid">Half cycle</option><option value="live">Play loops</option></select><button id="theme">Light background</button></header><p id="status" role="status">Loading native files…</p><main id="grid"></main><script type="module">
import {DotLottie} from '../../vendor/dotlottie-web.js';
DotLottie.setWasmUrl('../../vendor/dotlottie-player.wasm');
const grid=document.querySelector('#grid'),status=document.querySelector('#status'),set=document.querySelector('#set'),style=document.querySelector('#style'),profile=document.querySelector('#profile'),pose=document.querySelector('#pose');let players=[],theme='dark';
function paint(){const[k,w]=style.value.split('/');for(const{player,icon}of players){let a=icon.animations.find(a=>a.motionId===profile.value&&a.direction==='forward');if(pose.value==='reset')a=icon.animations.find(a=>a.motionId===profile.value&&a.direction==='reverse')||a;player.loadAnimation(a.name);player.setTheme(theme);for(const[n,v]of[['light',1.5],['regular',2],['bold',2.5]])player.setScalarSlot('style.outline.'+n,k!=='solid'&&+w===v?100:0);player.setScalarSlot('style.solid',k==='solid'?100:0);player.setScalarSlot('style.tint',k==='duotone'?18:0);player.pause();player.setSegment(0,a.frames-1);player.setLoop(pose.value==='live');player.setFrame(pose.value==='quarter'?36:pose.value==='mid'?72:0);if(pose.value==='live')player.play();}}
async function load(){for(const p of players)p.player.destroy();players=[];grid.replaceChildren();status.textContent='Loading native files…';try{const data=await fetch('../'+set.value+'/assets/set.json',{cache:'no-store'}).then(r=>r.json());for(const icon of data.icons){const article=document.createElement('article');article.innerHTML='<h2></h2><div class="sizes"></div>';article.querySelector('h2').textContent=icon.label;grid.append(article);const bytes=await fetch('../'+set.value+'/assets/'+icon.animations[0].name+'.lottie').then(r=>r.arrayBuffer());for(const size of[24,32,48]){const f=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.width=canvas.height=size;caption.textContent=size+' px';f.append(canvas,caption);article.querySelector('.sizes').append(f);const player=new DotLottie({canvas,data:bytes,autoplay:false,loop:false,renderConfig:{autoResize:false,devicePixelRatio:1,freezeOnOffscreen:false}});await new Promise((resolve,reject)=>{player.addEventListener('load',resolve);player.addEventListener('loadError',reject);});players.push({player,icon});}}paint();status.textContent=data.icons.length+' icons · native 24 / 32 / 48 px · '+players.length+' loaded canvases';document.body.dataset.ready='true';}catch(e){status.textContent='FAIL: '+e;}}
set.onchange=load;style.onchange=profile.onchange=pose.onchange=paint;document.querySelector('#theme').onclick=e=>{theme=theme==='dark'?'light':'dark';document.body.dataset.theme=theme;e.target.textContent=theme==='dark'?'Light background':'Dark background';paint();};load();
</script></html>
