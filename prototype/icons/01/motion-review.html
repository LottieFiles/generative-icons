<!doctype html><html lang="en"><meta charset="utf-8"><title>Internal Light / Strong motion review</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#10171d;color:#f2f5f7;font:14px system-ui}header{display:flex;align-items:center;gap:16px;position:sticky;top:0;background:#10171d;padding:12px 0;z-index:1}h1{font-size:21px;margin:0}button,select{font:inherit;background:#18242d;color:inherit;border:1px solid #526571;border-radius:8px;padding:8px}#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}article{border:1px solid #33434d;border-radius:12px;padding:16px}h2{font-size:15px;margin:0 0 18px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.profile{text-align:center}.sizes{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:16px}canvas{display:block;margin:auto}small{color:#a7b6bf}#status{margin:12px 0}body[data-theme=light]{background:#f5f9f8;color:#12242a}body[data-theme=light] header{background:#f5f9f8}body[data-theme=light] article{border-color:#abb8bb}
</style><header><h1>Internal comparison · actual native motion</h1><select id="style" aria-label="Paint"><option value="outline/2">Outline Regular</option><option value="outline/2.5">Outline Bold</option><option value="solid/2">Solid</option><option value="duotone/2">Duotone</option></select><select id="time" aria-label="Review time"><option value="0">0.00 s</option><option value=".15">0.15 s</option><option value=".19">0.19 s</option><option value=".2">0.20 s</option><option value=".4">0.40 s</option><option value=".5">0.50 s</option><option value=".65">0.65 s</option><option value=".8">0.80 s</option><option value="1.05">1.05 s</option><option value="2.2">End</option></select><button id="freeze">Inspect time</button><button id="replay">Replay both</button><button id="loop" aria-pressed="false">Loop pairs</button><button id="theme">Light background</button></header><p id="status" role="status">Loading…</p><main id="grid"></main><script type="module">
import{DotLottie}from'../../vendor/dotlottie-web.js';DotLottie.setWasmUrl('../../vendor/dotlottie-player.wasm');
const params=new URLSearchParams(location.search),setId=params.get('set')||'01',assetBase='../'+setId+'/assets/',filter=(params.get('icons')||'heart,bell,search').split(',');const players=[];let theme='dark',loop=null,generation=0;
function paint(){const[k,w]=document.querySelector('#style').value.split('/');for(const{player}of players){player.setTheme(theme);for(const[n,v]of[['light',1.5],['regular',2],['bold',2.5]])player.setScalarSlot('style.outline.'+n,k!=='solid'&&+w===v?100:0);player.setScalarSlot('style.solid',k==='solid'?100:0);player.setScalarSlot('style.tint',k==='duotone'?18:0);}}
function play(){generation++;for(const entry of players){const{player,icon,profile}=entry;entry.direction='forward';player.setLoop(!!icon.continuous);player.loadAnimation(icon.animations.find(a=>a.motionId===profile&&a.direction==='forward').name);player.setSegment(0,icon.continuous?icon.frames-1:icon.animations.find(a=>a.motionId===profile&&a.direction==='forward').rest+12);player.setFrame(0);player.play();}paint();document.body.dataset.cycle=String(generation);}
try{const meta=await fetch(assetBase+'set.json',{cache:'no-store'}).then(r=>r.json());for(const name of filter){const icon=meta.icons.find(i=>i.name===name);if(icon&&!icon.animations)icon.animations=icon.motions.flatMap(m=>[m,...(m.reverse?[m.reverse]:[])]);if(!icon)throw Error(name);const card=document.createElement('article');card.innerHTML='<h2></h2><div class="pair"></div>';card.querySelector('h2').textContent=icon.label;document.querySelector('#grid').append(card);for(const profile of['light','strong']){const section=document.createElement('section');section.className='profile';section.innerHTML='<small>'+profile+'</small><div class="hero"></div><div class="sizes"></div>';card.querySelector('.pair').append(section);const bytes=await fetch(assetBase+icon.name+(profile==='strong'?'-strong':'')+'.lottie?v='+icon.animations.find(a=>a.motionId===profile&&a.direction==='forward').sha256).then(r=>r.arrayBuffer());for(const size of[128,24,32,48]){const canvas=document.createElement('canvas');canvas.width=canvas.height=size;section.querySelector(size===128?'.hero':'.sizes').append(canvas);const player=new DotLottie({canvas,data:bytes,autoplay:false,loop:false,renderConfig:{autoResize:false,devicePixelRatio:1,freezeOnOffscreen:false}});await new Promise((ok,fail)=>{player.addEventListener('load',ok);player.addEventListener('loadError',fail)});const entry={player,profile,icon,direction:'forward'};players.push(entry);player.addEventListener('complete',()=>{if(entry.direction!=='forward')return;const reverse=icon.animations.find(a=>a.motionId===profile&&a.direction==='reverse');if(!reverse)return;entry.direction='reverse';player.loadAnimation(reverse.name);player.setSegment(0,reverse.rest+12);player.setFrame(0);paint();player.play();});}}}paint();document.querySelector('#status').textContent=filter.length+' pairs · 128 / 24 / 32 / 48 px · real seconds · native forward and return';document.body.dataset.ready='true';play();}catch(e){document.querySelector('#status').textContent='FAIL: '+e;}
document.querySelector('#freeze').onclick=()=>{if(loop){clearInterval(loop);loop=null;document.querySelector('#loop').setAttribute('aria-pressed','false');}for(const entry of players){entry.direction='inspect';entry.player.pause();entry.player.setLoop(false);entry.player.loadAnimation(entry.icon.animations.find(a=>a.motionId===entry.profile&&a.direction==='forward').name);entry.player.setSegment(0,143);entry.player.setFrame(Math.round(+document.querySelector('#time').value*60));}paint();document.body.dataset.reviewTime=document.querySelector('#time').value;};document.querySelector('#replay').onclick=play;document.querySelector('#style').onchange=()=>{paint();play()};document.querySelector('#loop').onclick=e=>{if(loop){clearInterval(loop);loop=null}else{play();loop=setInterval(()=>{if(!players.every(e=>e.icon.continuous))play()},3400)}e.target.setAttribute('aria-pressed',String(!!loop));};document.querySelector('#theme').onclick=e=>{theme=theme==='dark'?'light':'dark';document.body.dataset.theme=theme;e.target.textContent=theme==='dark'?'Light background':'Dark background';paint();};
</script></html>
