<!doctype html><html lang="en"><meta charset="utf-8"><title>Internal equal-time motion review</title><style>body{background:#10171d;color:#f4f8fa;font:16px system-ui;padding:24px}button{font:inherit;padding:12px;border-radius:8px}canvas{width:128px;height:128px}pre{display:none}</style><h1>Internal equal-time motion review</h1><p>Capture Light and Strong at the same times using the native player. Existing full-frame verification remains separate.</p><button id="run">Capture comparisons</button><p id="status" role="status">Ready</p><div id="stage"></div><pre id="report"></pre><script type="module">
import{DotLottie}from'../../vendor/dotlottie-web.js';DotLottie.setWasmUrl('../../vendor/dotlottie-player.wasm');
const times=[0,.08,.16,.24,.34,.46,.62,.84,1.1,1.4,2.35];
function paint(p){if(!p.setTheme('dark'))throw Error('Theme');for(const[n,v]of[['light',0],['regular',100],['bold',0]])if(!p.setScalarSlot('style.outline.'+n,v))throw Error('Outline');for(const n of['style.solid','style.tint'])if(!p.setScalarSlot(n,0))throw Error('Paint');}
const check=(v,m)=>{if(!v)throw Error(m)};
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;const report={mode:'capture',batch:'public-wall-clock',date:new Date().toISOString(),times,assets:[],errors:[]};try{const query=new URLSearchParams(location.search),only=query.get('icons')?.split(','),catalog=await fetch('../catalog.json',{cache:'no-store'}).then(r=>r.json());for(const ref of catalog.sets){const set=await fetch('../'+ref,{cache:'no-store'}).then(r=>r.json()),base='../'+ref.slice(0,ref.lastIndexOf('/')+1),id=ref.split('/')[0];for(const icon of set.icons.filter(i=>!only||only.includes(i.name))){document.querySelector('#status').textContent='Capturing '+icon.label;const selected=icon.motions.find(m=>m.motionId==='strong'),data=await fetch(base+selected.name+'.lottie?v='+selected.sha256,{cache:'no-store'}).then(r=>r.arrayBuffer());const bytes=new Uint8Array(await crypto.subtle.digest('SHA-256',data)),sha=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');check(sha===selected.sha256,'Package SHA changed');const canvas=document.createElement('canvas');canvas.width=canvas.height=128;document.querySelector('#stage').replaceChildren(canvas);const p=new DotLottie({canvas,data,autoplay:false,loop:false,useFrameInterpolation:false,renderConfig:{autoResize:false,devicePixelRatio:1,freezeOnOffscreen:false}});await new Promise((ok,no)=>{p.addEventListener('load',ok);p.addEventListener('loadError',no)});const strip=document.createElement('canvas');strip.width=times.length*128;strip.height=288;const c=strip.getContext('2d');c.fillStyle='#10171d';c.fillRect(0,0,strip.width,strip.height);c.font='12px monospace';c.textAlign='center';for(const[row,profile]of['light','strong'].entries()){const m=icon.motions.find(m=>m.motionId===profile);p.loadAnimation(m.name);check(p.activeAnimationId===m.name,'Wrong profile');check(p.totalFrames===m.frames,'Frame count');paint(p);p.setSegment(0,m.frames-1);for(const[k,t]of times.entries()){p.setFrame(Math.min(m.frames-1,Math.round(t*m.fps)));c.drawImage(canvas,k*128,row*144,128,128);c.fillStyle='#a6b3bc';c.fillText(t.toFixed(2)+' s',k*128+64,row*144+140);}}p.destroy();canvas.remove();const name=icon.name+'-wall-clock.png';report.assets.push({name:icon.name,set:id,sourcePackage:selected.name,sha256:sha,profiles:icon.motions.map(m=>({name:m.name,sha256:m.sha256})),image:name});if(location.port==='4191'){const response=await fetch('/_verification',{method:'POST',body:JSON.stringify({set:id,report,images:[{name,data:strip.toDataURL()}]})});check(response.ok,'Capture save failed');}}}report.result='PASS';document.querySelector('#status').textContent='PASS — '+report.assets.length+' equal-time comparisons captured.';}catch(error){report.result='FAIL';report.errors.push(String(error));document.querySelector('#status').textContent='FAIL — '+error;}if(location.port==='4191'&&report.assets.length)await fetch('/_verification',{method:'POST',body:JSON.stringify({set:report.assets.at(-1).set,report})});document.querySelector('#report').textContent=JSON.stringify(report);document.body.dataset.result=report.result;};
if(new URLSearchParams(location.search).get('autostart')==='1')document.querySelector('#run').click();
</script></html>
