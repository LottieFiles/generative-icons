name: Check library
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm run setup
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:distribution
      - run: npm run check:source
      - run: npm run check:assets
      - run: npm run check:paint
      - run: npm run docs:build
      - run: npm run check:docs
      - run: npm run build:packages
      - run: npm run test:packages
      - run: npm run pack:release
      - run: npm run test:consumers
      - run: git diff --exit-code -- prototype/icons/guide/
