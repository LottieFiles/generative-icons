name: Rust
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  # The toolchain the crates are linted with. Newer clippy releases add lints, so a bump
  # is a deliberate change; the MSRV job checks the workspace's rust-version.
  RUST_TOOLCHAIN: '1.93.1'
  # ThorVG must not fuse a*b+c into FMAs, or rendered pixels drift from the browser
  # player's evidence (see .cargo/config.toml). A CXXFLAGS set in the environment replaces
  # the config's value, so it carries the flag itself.
  CXXFLAGS: -ffp-contract=off
jobs:
  test:
    name: Build, lint and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
          - name: Linux x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev
          # vendor/rquickjs-sys builds V8's ieee754.cc, which must be compiled by clang.
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
      # The one side-by-side test that runs here (context against generation-context.mjs)
      # needs node; pin the version the goldens were checked with.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'vendor/**/build.rs') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Oracle tests skip when their inputs are missing: the gitignored scenes and natives
      # (the parity snapshot is maintainer-local), the built packages/*/dist, and the legacy
      # pipeline's motion/node_modules. None of them is provided here. The whole-catalog
      # and live tests are #[ignore]d.
      - name: Test
        run: cargo test --workspace --locked

  msrv:
    name: Check the minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Install the workspace's rust-version
        run: |
          msrv=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['rust-version'])")
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: msrv-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml') }}
          restore-keys: |
            msrv-${{ runner.os }}-
      - name: Check
        run: cargo "+$MSRV" check --workspace --all-targets --locked
