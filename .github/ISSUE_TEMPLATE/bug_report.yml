name: Bug report
description: Something renders, plays, installs or builds incorrectly.
labels: [bug]
body:
  - type: input
    id: icon
    attributes:
      label: Icon ID
      description: Leave empty if the bug is not specific to an icon.
      placeholder: heart
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Icon artwork or motion
        - gen-animated-icons CLI
        - Runtime package
        - React package
        - Local gallery
        - Documentation
    validations:
      required: true
  - type: input
    id: variant
    attributes:
      label: Variant
      description: Motion profile, style, weight, theme and size.
      placeholder: Strong, Outline 2, dark, 24 px
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Package version, or the output of `gen-animated-icons --version`.
      placeholder: 0.1.0
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include your environment (browser, framework, OS and platform) and a screenshot or recording if you can. For the CLI, include the command and its full output (run it with `--json` to get the error code and hint).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
