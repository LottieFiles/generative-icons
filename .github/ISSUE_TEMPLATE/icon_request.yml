name: Icon request
description: Ask for an icon that isn't in the library yet.
labels: [icon request]
body:
  - type: markdown
    attributes:
      value: |
        Search first: `npx generative-icons search "<meaning>"`. Want it now? Your coding AI can create it in your own project with `generative-icons create`; see [creating icons](https://github.com/LottieFiles/generative-icons/blob/main/docs/creating-icons.md).
  - type: input
    id: meaning
    attributes:
      label: Meaning
      description: What the icon represents.
      placeholder: Return a package
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Product context
      description: Where it appears and what action or state it communicates.
    validations:
      required: true
  - type: textarea
    id: states
    attributes:
      label: Motion and states
      description: Initial state, completed state, and whether it needs a reverse or reset.
      placeholder: Starts closed, opens on click, closes again when toggled off.
  - type: input
    id: neighbors
    attributes:
      label: Related existing icons
      placeholder: delivery-truck, return-package
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to create this icon myself and submit it.
